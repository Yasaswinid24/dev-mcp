stages:
  - test

default:
  image: python:3.12-slim
  cache:
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

.setup: &setup
  - apt-get update -qq && apt-get install -y -qq git > /dev/null
  - pip install -r requirements-dev.txt

unit-tests:
  stage: test
  before_script: *setup
  script:
    - pytest

integration-test:
  stage: test
  before_script: *setup
  script:
    # starts the real MCP server and calls every tool like Claude would
    - python test_client.py
